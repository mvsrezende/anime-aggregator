services:
  db:
    image: postgres:16-alpine
    container_name: anime_db
    environment:
      POSTGRES_DB: anime
      POSTGRES_USER: anime
      POSTGRES_PASSWORD: anime
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anime -d anime"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
    container_name: anime_api
    environment:
      APP_NAME: "anime-aggregator-api"
      APP_ENV: "dev"
      DATABASE_URL: "postgresql+psycopg://anime:anime@db:5432/anime"
      JIKAN_BASE_URL: "https://api.jikan.moe/v4"
      DEFAULT_USER_EMAIL: "marcos.rezende@al.infnet.edu.br"
      ANIME_CACHE_TTL_HOURS: "24"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: anime_frontend
    working_dir: /app
    environment:
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - api

volumes:
  pgdata:
  frontend_node_modules: